version: '3.8'

# Override file for development-specific settings
services:
  sqlserver:
    environment:
      - MSSQL_MEMORY_LIMIT_MB=2048

  rabbitmq:
    # Memory configuration is now handled via RabbitMQ config file
    # RABBITMQ_VM_MEMORY_HIGH_WATERMARK is deprecated
    deploy:
      resources:
        limits:
          memory: 512M
